[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
# TODO(template-derived): set your real repository URL after creating a repo from this template.
repository = "https://github.com/kazzarahw/rust-llm-template"
readme = "README.md"
keywords = ["cli", "template"]
categories = ["command-line-utilities"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
